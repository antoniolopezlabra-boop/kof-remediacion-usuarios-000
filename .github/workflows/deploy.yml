# Publica el tablero en GitHub Pages y aplica cambios de base de datos / funciones
# en Supabase en cada push a main. Secretos requeridos (Settings → Secrets → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY        → frontend
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF,
#   SUPABASE_DB_PASSWORD                             → migraciones y Edge Functions
name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  supabase:
    runs-on: ubuntu-latest
    if: ${{ vars.DESPLEGAR_SUPABASE == 'true' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase db push
      - run: supabase functions deploy --no-verify-jwt

  pages:
    runs-on: ubuntu-latest
    needs: [supabase]
    if: ${{ always() && (needs.supabase.result == 'success' || needs.supabase.result == 'skipped') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
